# The in-container screen daemon. Linux-only: built inside the
# computer image's Rust builder stage, never part of the daemon
# workspace. The screen pipeline runs inside this process.

[package]
name = "pagis-screend"
version = "0.1.0"
edition = "2024"

# Standalone on purpose: Linux-only Wayland code must not enter the
# cross-platform daemon workspace build.
[workspace]

[dependencies]
openh264 = "0.9"
png = "0.18"
str0m = "0.9"
rustix = { version = "1", features = ["fs", "mm", "shm", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
strip = true
