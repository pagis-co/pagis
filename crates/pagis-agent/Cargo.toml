[package]
name = "pagis-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
image.workspace = true
llm-router.workspace = true
object_store.workspace = true
pagis-broker.workspace = true
pagis-core.workspace = true
pagis-rt.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-util.workspace = true
tracing.workspace = true
utoipa.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { version = "0.6", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pagis-computer.workspace = true
pagis-knowledge.workspace = true
git2.workspace = true
pagis-audit.workspace = true
pagis-memory.workspace = true
pagis-storage-sqlite.workspace = true
pagis-testkit.workspace = true
sqlx.workspace = true
tempfile.workspace = true
wiremock.workspace = true
# `start_paused` lets deadline tests advance without a wall-clock wait.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
