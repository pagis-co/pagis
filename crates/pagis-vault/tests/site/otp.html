<!doctype html>
<!--
  The code step of a sign-in. The page writes the value of its code
  field into the document title.
-->
<meta charset="utf-8">
<title>otp</title>
<input id="code" name="code" autocomplete="one-time-code" inputmode="numeric" autofocus>
<script>
code.addEventListener("input", () => {
  document.title = "otp|" + code.value;
});
</script>
