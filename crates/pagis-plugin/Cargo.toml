[package]
name = "pagis-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
default = ["native"]
native = ["dep:git2", "dep:rust-embed", "dep:tempfile", "dep:tokio", "dep:async-trait", "dep:tracing"]

[dependencies]
async-trait = { workspace = true, optional = true }
git2 = { workspace = true, optional = true }
jsonschema.workspace = true
pagis-broker.workspace = true
pagis-core.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "rt"], optional = true }
tracing = { workspace = true, optional = true }
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures.workspace = true
pagis-testkit.workspace = true
rustix.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "main"
path = "tests/main.rs"
required-features = ["native"]

[[test]]
name = "wasm"
path = "tests/wasm.rs"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
