# daemon, so it has its own version.
version = "0.1.0"
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
p256.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
