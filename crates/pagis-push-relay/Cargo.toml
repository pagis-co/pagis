[package]
name = "pagis-push-relay"
# The Push Relay ships on its own tag, apart from the releases of the
# daemon, so it has its own version.
version = "0.1.0"
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
p256.workspace = true
rand.workspace = true
# APNs takes only HTTP/2.
reqwest = { workspace = true, features = ["http2"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
pagis-push.workspace = true
tempfile.workspace = true
web-push-native.workspace = true
wiremock.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
