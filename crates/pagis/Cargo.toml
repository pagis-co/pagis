tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# `keyring` reports a keychain OSStatus as a `security_framework` error.
# The daemon reads the code to tell a keychain that cannot show its prompt
# from a prompt that the person denied (ADR-0013). The major version is the
# one that `keyring` uses, so the two are one type.
security-framework = "3"

# A local installation on Linux keeps its Installation Key in the desktop
# keyring through the Secret Service (ADR-0013). `vendored` links libdbus
# statically, so neither the build host nor the machine needs libdbus
# installed; the machine still needs a session bus and a keyring daemon,
# and the daemon generates a Key File where none answers.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
chrono-tz.workspace = true
audio-codec-algorithms.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
git2.workspace = true
image.workspace = true
llm-router.workspace = true
# The VAPID Key test checks that the key is a point of P-256.
p256.workspace = true
pagis-evaluation.workspace = true
pagis-mcp-fixture.workspace = true
pagis-testkit.workspace = true
# The client side of a Web Push: the test decrypts each Notification.
web-push-native.workspace = true
reqwest.workspace = true
# The browser and pipeline sides of the Media Relay session test.
str0m = { workspace = true, features = ["openssl", "vendored", "sha1"] }
tar.workspace = true
tokio-tungstenite.workspace = true
# `compat` joins the duplex pipe of a test session socket to its yamux.
tokio-util = { workspace = true, features = ["compat"] }
wiremock.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
