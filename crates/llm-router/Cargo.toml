[package]
name = "llm-router"
version = "0.1.0"
edition = "2024"
license.workspace = true
autotests = false

[dependencies]
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
eventsource-stream = "0.2"
futures = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "test-util"] }
wiremock = "0.6"

[[test]]
name = "main"
path = "tests/main.rs"
