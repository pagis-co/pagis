[package]
name = "llm-router"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
eventsource-stream = "0.2"
futures = "0.3"
pagis-rt.workspace = true
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Retry jitter uses the host's random source.
getrandom = { version = "0.3", features = ["wasm_js"] }
send_wrapper = { version = "0.6", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
wiremock = "0.6"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "rt"
path = "tests/rt.rs"

[[test]]
name = "realtime_host"
path = "tests/realtime_host.rs"
