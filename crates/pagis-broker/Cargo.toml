[package]
name = "pagis-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
async-trait.workspace = true
hex.workspace = true
jsonschema.workspace = true
pagis-core.workspace = true
psl.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "sync", "time"] }
tree-sitter.workspace = true
tree-sitter-bash.workspace = true

[dev-dependencies]
pagis-audit.workspace = true
# The Home Exit of a Person on the two-Workspace harness (ADR-0029).
pagis-computer.workspace = true
pagis-storage-sqlite.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[[test]]
name = "main"
path = "tests/main.rs"
