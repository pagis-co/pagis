<!doctype html>
<!--
  The MCP Apps sandbox proxy (ADR-0016). The desk never frames a
  Widget page itself: it frames this document on a second origin, and
  this document loads the untrusted page into an inner frame.

  The inner frame carries `allow-scripts` and not `allow-same-origin`,
  so the page runs at an opaque origin of its own. It cannot reach this
  proxy, another proxy or the page of another Widget, and it has no
  persistent browser storage. The proxy sets this value itself and
  ignores a value in a message, because the isolation must not depend
  on a value that crosses the frame boundary. The daemon serves this
  file under the Widget's own Content-Security-Policy. The `srcdoc`
  page inherits it, so the policy is an HTTP header the page cannot
  rewrite.

  The proxy forwards every message in both directions and reads only
  the `ui/notifications/sandbox-` ones. It never mints a request of its
  own, as the extension requires.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Widget sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: transparent;
      }
      iframe {
        display: block;
        border: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        'use strict'

        var PROXY_READY = 'ui/notifications/sandbox-proxy-ready'
        var RESOURCE_READY = 'ui/notifications/sandbox-resource-ready'
        var RESERVED = 'ui/notifications/sandbox-'

        if (window.self === window.top) {
          throw new Error('The widget sandbox runs inside a frame.')
        }
        if (!document.referrer) {
          throw new Error('The widget sandbox cannot read the host origin.')
        }
        // The one origin this proxy speaks to. Everything else it hears
        // from the parent is dropped.
        var host = new URL(document.referrer).origin
        if (host === window.location.origin) {
          throw new Error('The host and the sandbox must have different origins.')
        }

        var inner = document.createElement('iframe')
        inner.setAttribute('sandbox', 'allow-scripts')
        inner.setAttribute('title', 'The widget')
        document.body.appendChild(inner)

        window.addEventListener('message', function (event) {
          var data = event.data
          if (event.source === window.parent) {
            if (event.origin !== host) return
            var method = data && data.method
            if (method === RESOURCE_READY) {
              var params = data.params || {}
              if (typeof params.html === 'string') inner.srcdoc = params.html
              return
            }
            if (typeof method === 'string' && method.indexOf(RESERVED) === 0) return
            if (inner.contentWindow) inner.contentWindow.postMessage(data, '*')
            return
          }
          // The page has an opaque origin, so its messages carry the
          // origin "null". Only the window of the inner frame counts.
          if (event.source === inner.contentWindow) {
            window.parent.postMessage(data, host)
          }
        })

        window.parent.postMessage(
          { jsonrpc: '2.0', method: PROXY_READY, params: {} },
          host,
        )
      })()
    </script>
  </body>
</html>
