[package]
name = "pagis-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = [
    "axum/tokio",
    "axum/ws",
    "dep:pagis-analytics",
    "dep:pagis-connect",
    "dep:pagis-google",
    "dep:pagis-plugin",
    "dep:pagis-plugins",
    "dep:pagis-software",
    "dep:pagis-telephony",
]

[dependencies]
anyhow.workspace = true
# The password hash of a person, as the Keypad Code already does.
argon2.workspace = true
async-trait.workspace = true
axum.workspace = true
# The keys of a Push Subscription and the VAPID Key are base64url.
base64.workspace = true
bytes.workspace = true
chrono-tz.workspace = true
futures.workspace = true
object_store.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
pagis-agent.workspace = true
pagis-analytics = { workspace = true, optional = true }
llm-router.workspace = true
pagis-broker.workspace = true
pagis-coding.workspace = true
pagis-computer.workspace = true
pagis-connect = { workspace = true, optional = true }
pagis-google = { workspace = true, optional = true }
pagis-core.workspace = true
pagis-needs-you.workspace = true
pagis-plugin = { workspace = true, optional = true }
pagis-plugins = { workspace = true, optional = true }
# The Web Push of each Notification (ADR-0030).
pagis-push.workspace = true
pagis-rt.workspace = true
pagis-software = { workspace = true, optional = true }
pagis-mail.workspace = true
pagis-telephony = { workspace = true, optional = true }
pagis-trigger.workspace = true
pagis-vault.workspace = true
pagis-voice.workspace = true
# The VAPID Key and the public key of each Push Subscription (ADR-0030).
p256.workspace = true
# The QR code of a Sign-In Link, as SVG and as terminal text.
qrcode.workspace = true
# The session and sign-in-link secrets.
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "rt"] }
# The signal that ends the live connections of one Session, and the
# `compat` pipe of the exit socket of a Host.
tokio-util = { workspace = true, features = ["compat"] }
# The CORS answer of the one Public Origin.
tower-http.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The Public Origin an Administrator types.
url.workspace = true
utoipa.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# The contract generator and its test read the utoipa contract of the
# full build.
[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"
required-features = ["native"]

[[test]]
name = "openapi"
path = "tests/openapi.rs"
required-features = ["native"]
