[package]
name = "pagis-coding"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-client-protocol.workspace = true
async-trait.workspace = true
futures.workspace = true
# The session socket of a Host is the first place of a Coding Session.
pagis-broker.workspace = true
pagis-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `io-util` gives the duplex pipes of the public `fake` module.
tokio = { workspace = true, features = ["sync", "rt", "io-util"] }
# `compat` joins the tokio pipes of the `fake` module to the futures I/O
# of the ACP transport.
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
# The REST answers of the daemon name who a pending ask waits for.
utoipa.workspace = true
# The Client App end of a session socket in the public `fake` module.
yamux.workspace = true

[dev-dependencies]
# The bus of the policy tests writes to the SQLite event log.
pagis-audit.workspace = true
pagis-storage-sqlite.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
