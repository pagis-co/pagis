# The configuration of cargo-about. `cargo xtask notices` writes the
# third-party notices of the Server Package, the Headless Server image
# and the Computer Image with it, and the gate step `notices` checks them
# (xtask/src/notices.rs, ADR-0037). The licenses of the npm packages of
# the Product App, of the Client App and of the Coding Harnesses are
# checked against the same `accepted` list.

# The licenses that a shipped dependency can have, in the order of
# preference: cargo-about uses the first one that a crate offers. Each one
# lets Pagis ship the software in a binary under the MIT License when the
# notices hold the license text. MPL-2.0 applies file by file and asks
# that the source of the covered files stays available: each crate's
# source is on crates.io under the name and the version that its notice
# gives. OFL-1.1 covers the Inter font of the Product App.
# BlueOak-1.0.0 and Python-2.0 cover npm packages of the Client App.
# Unlicense covers an npm package of a Coding Harness.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    "BlueOak-1.0.0",
    "Python-2.0",
    "Unlicense",
]

# The targets that a release ships, which `[graph] targets` of deny.toml
# also lists. The notices of one Server Package name the crates of the
# three targets.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# Build scripts and tests do not go into a shipped binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The workspace crates and pagis-screend are the code of Pagis, under the
# MIT License in LICENSE. Each one sets `publish = false`.
private = { ignore = true }
