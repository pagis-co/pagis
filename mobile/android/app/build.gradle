apply plugin: 'com.android.application'
// Reads `google-services.json`, the Firebase project of the Push Relay.
apply plugin: 'com.google.gms.google-services'

// The version of the app is the version of `mobile/package.json`, which is
// the workspace version.
def mobilePackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))

android {
    namespace = "app.pagis.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.pagis.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName mobilePackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The origin of the Push Relay that registers the Push Subscription
        // of the app (ADR-0032).
        buildConfigField "String", "PUSH_RELAY_ORIGIN", '"https://push-relay.invalid"'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // A body that `pagis-push` encrypted, which the tests of
                // `WebPushDecrypt` read (ADR-0032).
                def webPushFixture = rootProject.file('../../fixtures/web-push.json')
                inputs.file(webPushFixture).withPathSensitivity(PathSensitivity.NONE)
                systemProperty 'pagis.webPushFixture', webPushFixture.path
                // Robolectric sets up the shared memory of an SDK 36 app
                // through an internal class of the JDK.
                jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.google.crypto.tink:tink-android:$tinkVersion"
    // Web Push decryption (RFC 8291). `tink-android` holds the classes of
    // `tink`, so the module takes them from there.
    implementation("com.google.crypto.tink:apps-webpush:$tinkWebPushVersion") {
        exclude group: 'com.google.crypto.tink', module: 'tink'
    }
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation "com.google.android.gms:play-services-tasks:$playServicesTasksVersion"
    // The answer of a notification action: WorkManager runs the post, and
    // OkHttp sends it with no cookie store (ADR-0032).
    implementation "androidx.work:work-runtime:$workVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
    testImplementation "androidx.work:work-testing:$workVersion"
    // Android gives `org.json` only on a device; a JVM test needs the library.
    testImplementation "org.json:json:$orgJsonVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
