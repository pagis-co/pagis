# The daily advisory check. It runs `cargo xtask advisories`: cargo-deny
# over the Cargo lockfiles and npm audit over the npm lockfiles of main,
# and Trivy over the Computer Image and the Headless Server image of the
# latest release. When a check fails, it opens an issue that names each
# advisory in the output of the failed checks. When an open issue of this
# workflow exists, it adds a comment to that issue instead.
name: Advisories

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

# One run at a time, so two runs do not open two issues.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

# The actions are pinned as in ci.yml.

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The report opens an issue or adds a comment.
      issues: write
      # Trivy pulls the images of the release from GHCR.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # xtask downloads the pinned cargo-deny and Trivy and checks their
      # hashes. The log is the input of the report below.
      - name: cargo xtask advisories
        id: check
        shell: bash
        run: cargo xtask advisories 2>&1 | tee advisories.log
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}

      - name: open or update the advisory issue
        if: failure() && steps.check.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Dependency advisories need a review'
          # xtask starts the output of each step with "== <step>:" and ends
          # with a "FAIL <step>" line for each failed step. A passing step,
          # such as npm audit below the high level, can name an advisory too.
          failed=$(sed -n 's/^FAIL *\([^ ]*\).*/\1/p' advisories.log)
          ids=$(awk -v failed="$failed" '
            BEGIN { n = split(failed, f, "\n"); for (i = 1; i <= n; i++) bad[f[i]] = 1 }
            /^== / { name = $2; sub(/:$/, "", name); keep = (name in bad) }
            keep' advisories.log \
            | grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}|GHSA(-[0-9a-z]{4}){3}|CVE-[0-9]{4}-[0-9]{4,}' | sort -u || true)
          {
            echo "The daily advisory check failed: $RUN_URL"
            echo
            if [ -n "$ids" ]; then
              echo 'The advisories in the output of the failed checks:'
              echo
              printf -- '- %s\n' $ids
            else
              echo 'The output names no advisory. Read the log of the run.'
            fi
            echo
            echo 'Update each dependency, or record a reviewed exception with its reason in deny.toml or .trivyignore.'
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "author:app/github-actions" --state open \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi
