# The release of the Push Relay image for a `push-relay-v*` tag. The tag
# names the version in `crates/pagis-push-relay/Cargo.toml`
# (`push-relay-v0.1.0` for `0.1.0`), and each image job stops on a tag that
# names another version (docs/PUSH-RELAY.md):
#
# 1. The gate: the CI workflow on the tagged commit.
# 2. The image of each platform, on a runner of its own architecture: the
#    advisory check of the Cargo lockfile, the build, the secret scan, the
#    vulnerability scan, and the push by digest.
# 3. The manifest job joins the digests under the version and attests
#    its provenance.
#
# The relay is not an artifact of the `v*` release (release.yml).
name: Push Relay

on:
  push:
    tags: ["push-relay-v*"]

# One run per tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The actions are pinned as in ci.yml.

jobs:
  gate:
    name: gate
    uses: ./.github/workflows/ci.yml

  relay-image:
    name: Push Relay image (${{ matrix.platform }})
    needs: gate
    # Each platform builds on a runner of its own architecture, so no
    # build runs under emulation. Each job pushes its platform by digest.
    strategy:
      matrix:
        include:
          - { platform: amd64, runner: ubuntu-24.04 }
          - { platform: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: cargo xtask relay-image
        run: cargo xtask relay-image --platform "$PLATFORM" --tag "$GITHUB_REF_NAME"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-relay-${{ matrix.platform }}
          path: dist/image-digests/

  relay-manifest:
    name: Push Relay image manifest
    needs: relay-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-relay-*
          path: dist/image-digests
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: cargo xtask relay-image --manifest
        run: cargo xtask relay-image --manifest --tag "$GITHUB_REF_NAME"

      - name: resolve the image digest
        id: digest
        run: |
          version=${GITHUB_REF_NAME#push-relay-v}
          relay=$(docker buildx imagetools inspect "ghcr.io/pagis-co/pagis-push-relay:$version" --format '{{.Manifest.Digest}}')
          echo "relay=$relay" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/pagis-co/pagis-push-relay
          subject-digest: ${{ steps.digest.outputs.relay }}
          push-to-registry: true
