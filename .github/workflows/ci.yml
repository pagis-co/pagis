# The checks of each pull request, of the merge queue and of main. The
# jobs run at the same time, and each one runs a group of the gate steps
# with `cargo xtask step`, the code that `cargo xtask full` runs, so the
# local gate and CI run the same commands. The `ci-success` job is the one
# check that branch protection and the merge queue require. The advisory
# checks run in advisories.yml, so a newly published advisory does not
# block an unrelated pull request.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs the gate on the tagged commit.
  workflow_call:

# A new push to a pull request cancels the run of its earlier push. Runs
# on main, in the merge queue and of a release always finish. The group
# names this workflow literally: a called workflow sees the name of its
# caller in `github.workflow`, and the release run holds that group.
concurrency:
  group: CI-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The nextest profile of a GitHub runner: .config/nextest.toml names the
  # tests that need a Docker host the runner is not.
  NEXTEST_PROFILE: ci
  # CI builds keep no debug info: the target directory, the cache and the
  # link times shrink to a fraction, and a panic still names its line.
  CARGO_PROFILE_DEV_DEBUG: 0

# Every job reads the caches of main, and only a run on main writes
# them, so a pull request neither evicts nor duplicates them. A job that
# fails still writes its Rust cache, so a red main leaves its compiles.
#
# Each action is pinned to a full commit ID, with its release tag in a
# comment, because a tag or a branch can move to other code. Each
# checkout sets `persist-credentials: false`: no step pushes with git, so
# the job token stays out of the git configuration of the later steps.
# `cargo xtask pins --check` holds these rules, and Dependabot opens the
# pull requests that move the pins.

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - run: cargo xtask step fmt clippy

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # A runner starts with about 14 GB free. This job holds the build of
      # the workspace tests, the Computer Image twice (in the buildx builder
      # and in Docker), the Rust image and the build of screend, and the
      # service images of the Docker tests, so it removes the toolchains the
      # runner ships and the job never uses.
      # The removal takes from one to six minutes and the job fills the
      # disk only when it builds, so the removal runs in the background
      # while the job checks out and restores its cache.
      - name: Free disk space
        run: |
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest

      # The interop test of the exit socket runs the Client App's own
      # TypeScript under node, which strips its types
      # (crates/pagis/tests/home_exit.rs). It needs no npm package.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The tests run the Rust image and the Postgres image from Docker
      # Hub, so the daemon pulls them through mirror.gcr.io. The restart
      # comes before the builder starts.
      - run: .github/scripts/docker-hub-mirror.sh

      # The image build reads its layers from the GitHub Actions cache,
      # which a buildx builder of the docker-container driver reaches
      # with the runtime token of the job. The builder pulls the base
      # images through mirror.gcr.io (buildkitd.toml).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: buildkitd.toml

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The Docker-real tests run in the Computer Image of this tree, so
      # the job builds the image first. The tests of screend run in the
      # Rust image that builds screend in the Computer Image. The named
      # volumes that keep their Cargo registry and target directory start
      # empty on a runner, so the step compiles screend each time.
      - run: cargo xtask step computer-image screend-test test
        env:
          PAGIS_IMAGE_CACHE_FROM: type=gha,scope=computer-image
          PAGIS_IMAGE_CACHE_TO: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=computer-image,mode=max' || '' }}

  contract:
    name: contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The generated API types need the npm packages of the UI.
      - run: cargo xtask step ui-deps contract-drift gog-contract

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: cargo xtask step ui-deps ui-typecheck ui-test

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: cargo xtask step desktop-deps desktop-typecheck desktop-test

  docs-site:
    name: docs site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # The build compiles each page, so a page that does not compile fails
      # the job. The export step then serves the export in the local runtime
      # of Cloudflare and reads each address.
      - run: cargo xtask step docs-site-deps docs-site-typecheck docs-site-test docs-site-build docs-site-export

  # The JUnit tests of the Mobile App run with the Android SDK of the
  # runner image, which sets ANDROID_HOME. A named native step fails when
  # its toolchain is absent, so the job never passes a test that did not
  # run.
  mobile:
    name: Mobile App
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: cargo xtask step mobile-deps mobile-typecheck mobile-test mobile-android-test

  mobile-ios:
    name: Mobile App (iOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      # Capacitor 8 builds with Xcode 26 or later. The runner image holds
      # several Xcode releases, and the newest one is selected.
      - name: select Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "the runner has no Xcode 26 or later:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode"
          xcodebuild -version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: cargo xtask step mobile-deps mobile-ios-test

  checks:
    name: pins, secrets and generated tables
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - run: cargo xtask step pins emergency-drift secret-scan pagis-apt

  packaging-macos:
    name: packaging smoke (macOS)
    # macos-latest is arm64, the one macOS architecture the app ships
    # (ADR-0025).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The client jobs of release.yml run the same build.
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The fixture has the production lock schema but no release bytes. The
      # unsigned smoke opens only the local setup page. It also tests the
      # compiled installer modules with a deterministic local release fixture.
      - name: write deterministic runtime lock
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          cargo xtask runtime-lock write-fixture "$version" darwin-arm64 dist/runtime-lock-darwin-arm64.json

      - name: cargo xtask desktop
        run: cargo xtask desktop
        env:
          PAGIS_HOME: ${{ runner.temp }}/pagis-home

  packaging-linux:
    name: packaging smoke (Linux)
    # One amd64 runner packs both architectures: the client holds no
    # native module, so an arm64 package is the arm64 Electron build with
    # the same app archive. The smoke runs the amd64 client (ADR-0025).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The client jobs of release.yml run the same build.
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The smoke opens a window, so it needs a display.
      - name: install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Ubuntu 24.04 refuses unprivileged user namespaces to programs with
      # no AppArmor profile. The unpacked client has none, and its Chromium
      # sandbox needs them. The deb installs a profile on a person's machine.
      - name: allow the Chromium sandbox of the unpacked client
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The fixtures have the production lock schema but no release bytes.
      # The smoke opens only the local setup page.
      - name: write deterministic runtime locks
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          for platform in linux-x64 linux-arm64; do
            cargo xtask runtime-lock write-fixture "$version" "$platform" "dist/runtime-lock-$platform.json"
          done

      - name: cargo xtask desktop
        run: cargo xtask desktop
        env:
          PAGIS_HOME: ${{ runner.temp }}/pagis-home

  # The one required check. A skipped job counts as passed for a required
  # check, so this job runs also when a job that it needs fails, and it
  # fails unless each of them passed.
  ci-success:
    name: CI success
    if: always()
    needs:
      - lint
      - test
      - contract
      - ui
      - desktop
      - docs-site
      - mobile
      - mobile-ios
      - checks
      - packaging-macos
      - packaging-linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --color-output . <<< "$NEEDS"
          jq --exit-status 'all(.[]; .result == "success")' <<< "$NEEDS"
