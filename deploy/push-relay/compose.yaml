# One Push Relay on one Linux host: the relay, and a Cloudflare Tunnel in
# front of it. `docs/PUSH-RELAY.md` holds the deployment.
#
#   cp .env.example .env      # and fill it in
#   mkdir -p secrets          # and put the key files and the token in it
#   docker compose up -d
#
# This file serves the iOS app through APNs. `compose.fcm.yaml` adds the
# Android app through FCM. `COMPOSE_FILE` in `.env` selects the files.
#
# Every setting is stated once, in `.env`. Nothing here is edited for a
# deployment.
#
# cloudflared is pinned by tag and digest, so a relay runs the bytes that
# were tested. Dependabot moves the digest. The relay image takes its tag
# from `PUSH_RELAY_VERSION`.
#
# The tunnel connects out to Cloudflare, and Cloudflare holds the TLS
# certificate. No service publishes a port, so the host needs no inbound
# port and no public address.
#
# The two services share one network with a fixed subnet, and each one
# has a fixed address on it. The relay believes `X-Forwarded-For` only
# from the address that `PUSH_RELAY_TRUSTED_PROXY` names, so the
# registration limit counts the address of each phone and not the
# address of the tunnel. Docker gives a dynamic address from the start of
# the subnet, so a service with no fixed address could take the address
# of the tunnel before the tunnel starts.
name: pagis-push-relay

services:
  # The relay. It listens on 8080 on the network of the deployment and
  # publishes no port: only the tunnel reaches it.
  relay:
    image: ghcr.io/pagis-co/pagis-push-relay:${PUSH_RELAY_VERSION:?set PUSH_RELAY_VERSION in .env}
    restart: unless-stopped
    environment:
      # The origin of each endpoint that the relay gives a Mobile App.
      # The VAPID token of each Web Push names it in `aud`.
      PUSH_RELAY_PUBLIC_ORIGIN: https://${PUSH_RELAY_DOMAIN:?set PUSH_RELAY_DOMAIN in .env}
      # The fixed address of the tunnel below.
      PUSH_RELAY_TRUSTED_PROXY: 10.231.0.2
      # One APNs key for each environment.
      PUSH_RELAY_APNS_PRODUCTION_KEY_PATH: /run/secrets/apns-production-key
      PUSH_RELAY_APNS_PRODUCTION_KEY_ID: ${PUSH_RELAY_APNS_PRODUCTION_KEY_ID:?set PUSH_RELAY_APNS_PRODUCTION_KEY_ID in .env}
      PUSH_RELAY_APNS_SANDBOX_KEY_PATH: /run/secrets/apns-sandbox-key
      PUSH_RELAY_APNS_SANDBOX_KEY_ID: ${PUSH_RELAY_APNS_SANDBOX_KEY_ID:?set PUSH_RELAY_APNS_SANDBOX_KEY_ID in .env}
      PUSH_RELAY_APNS_TEAM_ID: ${PUSH_RELAY_APNS_TEAM_ID:?set PUSH_RELAY_APNS_TEAM_ID in .env}
      PUSH_RELAY_APNS_TOPIC: ${PUSH_RELAY_APNS_TOPIC:?set PUSH_RELAY_APNS_TOPIC in .env}
    secrets:
      # Compose outside Swarm mounts each file read only, with its owner
      # and its mode on the host. The relay runs as the user 10001, so
      # each file on the host has the owner 10001 and the mode 400.
      - apns-production-key
      - apns-sandbox-key
    volumes:
      # The state directory: the SQLite file of the registrations.
      - relay-data:/var/lib/pagis-push-relay
    networks:
      relay:
        ipv4_address: 10.231.0.3

  # The way in. cloudflared runs the remotely-managed Cloudflare Tunnel
  # of the token. The published application route of the tunnel, in the
  # Cloudflare dashboard, sends each request to `http://relay:8080`.
  # Cloudflare writes the address of each client at the end of
  # `X-Forwarded-For`, and cloudflared does not change that header.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    command: ["tunnel", "run"]
    environment:
      # cloudflared reads the token of the tunnel from this file.
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflared-token
    secrets:
      # cloudflared runs as the user 65532, so the file on the host has
      # the owner 65532 and the mode 400.
      - cloudflared-token
    networks:
      relay:
        ipv4_address: 10.231.0.2

networks:
  relay:
    ipam:
      config:
        - subnet: 10.231.0.0/24

secrets:
  apns-production-key:
    file: ./secrets/apns-production-key.p8
  apns-sandbox-key:
    file: ./secrets/apns-sandbox-key.p8
  cloudflared-token:
    file: ./secrets/cloudflared-token

volumes:
  relay-data:
