# One Pagis server on one Linux VM.
#
# The shape is stated in https://docs.pagis.co/server#the-shape and it is the
# whole shape: one VM, one daemon, one state directory, Postgres for the
# records, and no second daemon. Two daemons on one database is not a
# supported deployment.
#
#   cp .env.example .env      # and fill it in
#   docker compose up -d
#
# Every setting is stated once, in `.env`. Nothing here is edited for a
# deployment.
#
# The way in is a Compose profile, which `COMPOSE_PROFILES` in `.env`
# selects. `proxy` runs Caddy, for a VM with a domain name. `tailscale`
# runs the owner's Tailscale Funnel in place of Caddy, for a machine at
# home with no domain name and no open port, in Remote Access
# (https://docs.pagis.co/server/remote-access). The other services run
# with either one.
#
# `postgres`, `klipper-lb`, `caddy` and `tailscale` are pinned by tag and
# digest, so a server runs the bytes that its release was tested with.
# Dependabot moves the digests between releases, and an upgrade takes the
# `compose.yaml`, the `egress.sh`, the `Caddyfile` and the
# `tailscale-serve.json` of the new release
# (https://docs.pagis.co/server/upgrade).
#
# **Every service shares the host's network namespace**, which is what
# makes an Agent's Computer work. The daemon starts each Computer as a
# container of its own and reaches it on the Docker host's loopback, so
# a daemon with a network namespace of its own reaches none of them.
# Host networking also gives the Media Relay its UDP range directly,
# with no forwarder for each port, and it gives the `egress` service the
# VM's firewall. It is a Linux facility; this image is for a Linux VM and
# not for a desktop Docker.
#
# Privacy is then a bind address rather than a published port: Postgres,
# the product port and the administration port each bind loopback. Caddy
# is the one service that binds a public interface for the browsers. The
# daemon binds the Media Relay's UDP range, the exit port and the model
# port of the Computers on every interface. The VM's firewall opens the
# range alone, and the egress rules close the exit port and the model
# port to everything but the Computers. The Tailscale service opens no port for the Funnel: the
# Funnel comes in through the tunnel that the service opens to
# Tailscale.
name: pagis

services:
  # The records. The files stay on the daemon's own disk, so this
  # holds the database and nothing else. It listens on loopback, which
  # on a host network is the whole of its reachability.
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: pagis
      POSTGRES_DB: pagis
      POSTGRES_PASSWORD: ${PAGIS_DATABASE_PASSWORD:?set PAGIS_DATABASE_PASSWORD in .env}
    # The image's own volume. Postgres keeps its data in a directory of
    # its major version below it.
    volumes:
      - pagis-database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pagis -d pagis"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The egress policy of the Computers (ADR-0014). `egress.sh` writes
  # rules into the VM's DOCKER-USER and INPUT chains: a Computer reaches
  # the public internet, the Media Relay's UDP range, the daemon's exit
  # port (ADR-0029) and the daemon's Harness Model Endpoint (ADR-0033),
  # and no other address of this VM, no link-local address and no private
  # address outside PAGIS_COMPUTER_ALLOW. The rules are the VM's, so root
  # inside a Computer cannot remove them, and this service writes them
  # because the daemon does not own the VM's firewall.
  #
  # The daemon starts after the rules are in place. The service then
  # stays up, so Docker starts it again when the VM boots, and each start
  # writes the rules again. The image is Alpine with iptables and
  # BusyBox; its own entrypoint is not used.
  egress:
    image: rancher/klipper-lb:v0.4.17@sha256:910944bb0bd94f060a82a56ca1ea1c577d3e49b3473a093a47a985f32e92d94a
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    init: true
    environment:
      PAGIS_MEDIA_PORT_FIRST: ${PAGIS_MEDIA_PORT_FIRST}
      PAGIS_MEDIA_PORT_LAST: ${PAGIS_MEDIA_PORT_LAST}
      # The daemon's exit port, as PAGIS_COMPUTER_EXIT_PORT below.
      PAGIS_EXIT_PORT: "4403"
      # The daemon's Harness Model Endpoint, as PAGIS_COMPUTER_MODEL_PORT
      # below.
      PAGIS_MODEL_PORT: "4404"
      PAGIS_COMPUTER_ALLOW: ${PAGIS_COMPUTER_ALLOW:-}
    volumes:
      - ./egress.sh:/pagis/egress.sh:ro
    # The mark of a start whose rules are in place. A tmpfs is empty at
    # each start of the container.
    tmpfs:
      - /run/pagis
    entrypoint:
      - sh
      - -c
      - sh /pagis/egress.sh && touch /run/pagis/egress-ready && exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-e", "/run/pagis/egress-ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The daemon. It is the only service that reaches the Docker socket,
  # because it is the only one that starts Computers.
  pagis:
    image: ghcr.io/pagis-co/pagis-server:${PAGIS_VERSION:?set PAGIS_VERSION in .env}
    restart: unless-stopped
    # A stop sends SIGTERM, and the daemon then stops the Computers it
    # holds awake. Docker gives each Computer ten seconds to stop, so
    # the daemon gets more than that before Docker sends SIGKILL.
    stop_grace_period: 30s
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      # No Computer starts before the egress rules are in place.
      egress:
        condition: service_healthy
    environment:
      # The product port answers the proxy on loopback, never the
      # internet. The proxy is on the same loopback, so it is also the
      # one address whose forwarded headers the daemon believes.
      PAGIS_BIND: 127.0.0.1
      # The restart policy above starts the daemon again when it exits
      # for a restart, so the Administration Interface says so.
      PAGIS_SUPERVISED: "1"
      PAGIS_PORT: 4400
      # The origin a browser reaches this installation at. The image
      # refuses to start without it. The image is a server, so it holds
      # no Client Credential: it writes no credential file, refuses the
      # credential trade and prints no sign-in link (ADR-0025).
      PAGIS_PUBLIC_ORIGIN: https://${PAGIS_DOMAIN:?set PAGIS_DOMAIN in .env}
      PAGIS_TRUSTED_PROXY: 127.0.0.1
      # Remote Access (ADR-0028), with the `tailscale` profile: another
      # machine signs in with a Sign-In Link and never with a password,
      # and the TURN server of the live screen listens on 127.0.0.1:4402
      # for the Funnel. Empty with the `proxy` profile.
      PAGIS_REMOTE_ACCESS: ${PAGIS_REMOTE_ACCESS:-}
      # The administration port stays on loopback, so it is reachable
      # over an SSH tunnel and from nowhere else.
      PAGIS_ADMINISTRATION_BIND: 127.0.0.1
      PAGIS_ADMINISTRATION_PORT: 4401
      PAGIS_DATABASE_URL: postgres://pagis:${PAGIS_DATABASE_PASSWORD}@127.0.0.1:5432/pagis
      # The Media Relay: the address a browser reaches it at and the UDP
      # range it binds, stated once. Open exactly that range in
      # the VM's firewall.
      PAGIS_SCREEN_ADVERTISE_IP: ${PAGIS_PUBLIC_IP:?set PAGIS_PUBLIC_IP in .env}
      PAGIS_SCREEN_MEDIA_PORT_FIRST: ${PAGIS_MEDIA_PORT_FIRST}
      PAGIS_SCREEN_MEDIA_PORT_LAST: ${PAGIS_MEDIA_PORT_LAST}
      # The exit listener (ADR-0029): the Exit Proxy of each Agent's
      # Computer in Home mode sends its connections here, and the daemon
      # carries them through the Person's Home Exit. It binds every
      # interface and answers a Computer's token alone; the egress rules
      # close it on every interface but the Computers' bridges.
      PAGIS_COMPUTER_EXIT_PORT: "4403"
      # The Harness Model Endpoint (ADR-0033): the harness of a Coding
      # Session in a Computer sends its model requests here. It binds
      # every interface and answers a session's token alone; the egress
      # rules close it on every interface but the Computers' bridges.
      # PAGIS_MODEL_PORT of the egress service names the same port.
      PAGIS_COMPUTER_MODEL_PORT: "4404"
      # The first run, with no browser. They are read at
      # the first start that finds nobody who can sign in, and ignored
      # from then on. Leave them empty to finish setup on the
      # administration port instead.
      PAGIS_ADMIN_EMAIL: ${PAGIS_ADMIN_EMAIL:-}
      PAGIS_ADMIN_PASSWORD: ${PAGIS_ADMIN_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      DOCKER_HOST: unix:///var/run/docker.sock
    secrets:
      # The Installation Key that seals `secrets.enc` (ADR-0013), at
      # `/run/secrets/pagis-secrets-key`. Compose outside Swarm mounts
      # the file as it is on the host, with its owner and its mode. The
      # daemon refuses a key file that a group or another user can
      # read, so the file on the host has mode 600.
      - pagis-secrets-key
    volumes:
      # The state directory: the sealed secrets, the memory
      # repositories, the artifacts, the recordings, the Plugins and the
      # Software. `deploy/backup.sh` captures it. It is a directory of
      # the VM at the same path, not a named volume: the daemon gives
      # each Computer the screend token and the Plugin checkouts as bind
      # mounts of files in it, and Docker reads a bind source on the VM.
      - /var/lib/pagis:/var/lib/pagis
      # The Docker socket, for the Computers. Nothing else in this file
      # receives it: reaching this socket is reaching the host.
      - /var/run/docker.sock:/var/run/docker.sock

  # The way in of the `proxy` profile: the reverse proxy. It holds the
  # certificate and speaks TLS to the browser; the daemon terminates no
  # TLS (ADR-0024). It is the one service that binds a public interface,
  # on 80 and 443.
  proxy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    profiles: [proxy]
    restart: unless-stopped
    network_mode: host
    depends_on:
      - pagis
    environment:
      PAGIS_DOMAIN: ${PAGIS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # The way in of the `tailscale` profile: the owner's Tailscale Funnel
  # (ADR-0028). The official image joins the tailnet as `TS_HOSTNAME`
  # and applies `tailscale-serve.json`, with the name of this machine,
  # `<TS_HOSTNAME>.<tailnet>.ts.net`, in place of `${TS_CERT_DOMAIN}`.
  # The Funnel then forwards port 443 to the product port, and port 8443,
  # with TLS ended, to the TURN server of the live screen, both on
  # loopback. `tailscaled` holds the certificate. The image reads the
  # file at each start, so `docker compose restart tailscale` applies a
  # new one.
  #
  # Userspace networking adds no interface, no route and no firewall
  # rule to the host, so the service needs no capability. The node
  # keeps its key in a volume: the auth key is read at the first start
  # alone, and every later start uses the key in the volume.
  tailscale:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    profiles: [tailscale]
    restart: unless-stopped
    network_mode: host
    depends_on:
      - pagis
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-pagis}
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/tailscale-serve.json
    volumes:
      - ./tailscale-serve.json:/config/tailscale-serve.json:ro
      - tailscale-state:/var/lib/tailscale

secrets:
  pagis-secrets-key:
    file: ./secrets/pagis-secrets-key

volumes:
  pagis-database:
  caddy-data:
  caddy-config:
  tailscale-state:
